<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B1A00" />
      <stop offset="100%" stop-color="#120B00" />
    </linearGradient>
    <radialGradient id="glow-grad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFD066" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#FFD066" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFD066" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E9CA78" />
      <stop offset="50%" stop-color="#D1AE52" />
      <stop offset="100%" stop-color="#9A7B38" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAA09" />
      <stop offset="100%" stop-color="#FFD066" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg-grad)" rx="16" />
  
  <!-- Subtle pattern grid -->
  <g opacity="0.1" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
    <line x1="80" y1="0" x2="80" y2="300" />
    <line x1="160" y1="0" x2="160" y2="300" />
    <line x1="240" y1="0" x2="240" y2="300" />
    <line x1="320" y1="0" x2="320" y2="300" />
  </g>

  <!-- Glow orb -->
  <circle cx="200" cy="120" r="140" fill="url(#glow-grad)" />

  <!-- Center Artwork Icon -->
  
      <g transform="translate(200, 115)" filter="url(#shadow)">
        <polygon points="0,-40 38,25 -38,25" fill="#FFAA09" stroke="#FFE082" stroke-width="2" />
        <polygon points="0,-25 24,20 -24,20" fill="#E65100" />
        <circle cx="0" cy="5" r="10" fill="#FFD54F" />
        <text x="0" y="9" fill="#000" font-family="Arial, sans-serif" font-weight="900" font-size="12" text-anchor="middle">☀</text>
      </g>
    

  <!-- Dark gradient footer bar -->
  <rect x="0" y="210" width="400" height="90" fill="black" opacity="0.85" rx="0" />
  <rect x="0" y="210" width="400" height="2" fill="url(#gold-grad)" />

  <!-- Provider badge (top-left) -->
  <g transform="translate(16, 16)">
    <rect width="80" height="22" rx="6" fill="#0A0A0A" opacity="0.85" stroke="#FFAA09" stroke-width="1" />
    <text x="40" y="15" fill="#E9CA78" font-family="Arial, sans-serif" font-weight="900" font-size="10" text-anchor="middle" letter-spacing="1">JILI</text>
  </g>

  <!-- Tag (top-right) -->
  <g transform="translate(310, 16)">
    <rect width="74" height="22" rx="6" fill="#FFAA09" />
    <text x="37" y="15" fill="#000000" font-family="Arial, sans-serif" font-weight="900" font-size="10" text-anchor="middle" letter-spacing="0.5">PLAY</text>
  </g>

  <!-- Title & Subtitle in footer -->
  <text x="200" y="245" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="900" font-size="18" text-anchor="middle" letter-spacing="0.5">GOLDEN EMPIRE</text>
  <text x="200" y="268" fill="#D1AE52" font-family="Arial, sans-serif" font-weight="700" font-size="11" text-anchor="middle" letter-spacing="0.5">Incan Treasure Megaways</text>
  <text x="200" y="287" fill="#888888" font-family="Arial, sans-serif" font-weight="600" font-size="9" text-anchor="middle">DEMO ENTERTAINMENT MODE</text>
</svg>